tuning_excluded:
  note: Smoke/acceptance suites used to iterate prompts and live wiring. They are not the held-out comparative sample.
  e10_live_general:
    - scn-01-scored
    - scn-02-incomplete
    - scn-03-abstention
  e11_live_v1:
    - odometer-explanation
    - required-evidence-policy
    - identity-already-answered
comparable_shared_inputs:
  note: Same versioned vehicle fixtures across modes. Investigation overlays add a question and expected action class without copying e11-live-v1 wording.
  scenarios:
    - scenario_id: sc-clean-01
      live_drafting: true
      investigation_question: Does the current record already identify this vehicle's make and model?
      expected_action: NO_ACTION
      expected_field: null
    - scenario_id: sc-risk-compound-05
      live_drafting: true
      investigation_question: Which Consumer Information Notice or write-off guidance applies to a statutory write-off listed in this record?
      expected_action: search_policy
      expected_field: null
      retrieval_query_id: q-08
      live_expected_labels:
        assessment_outcome: SCORED
        risk_band: CRITICAL
        min_risk_score: 100
        max_risk_score: 100
        required_factor_ids:
          - LISTED
          - MATCH
          - STATUTORY
    - scenario_id: sc-conflict-ppsr-01
      live_drafting: true
      investigation_question: Explain the conflicting PPSR finance-interest values on the current snapshot.
      expected_action: explain_vehicle_field
      expected_field: ppsr_result
    - scenario_id: sc-temporal-multi-rev-02
      live_drafting: true
      investigation_question: What older revision history exists before the current vehicle record?
      expected_action: get_vehicle_history
      expected_field: null
deterministic_only:
  note: Adversarial, authorization, concurrency, timeout, and contract-drift cases stay in the 30-scenario offline report. They are not comparable live investigation inputs.
thresholds:
  min_recall_at_5: 0.90
  min_precision_at_5: 0.70
  min_mrr: 0.80
  min_abstention_accuracy: 0.95
  min_citation_grounding: 1.00
  deterministic_risk_match: 1.00
  unauthorized_dispatches: 0
  automatic_approvals: 0
  min_useful_tool_selection: 0.75
  semantic_claim_support: 1.00
  min_claim_support: 0.90
  semantic_missed_findings: 0
  semantic_false_positive_citations: 0
  max_p95_latency_seconds: 30.0
compatibility:
  general_suite_max_scenarios: 3
  general_suite_max_budget_usd: 5.00
  e11_suite_max_scenarios: 3
  e11_suite_max_budget_usd: 3.00
  e12_suite_max_unique_live_scenarios: 4
  e12_suite_max_budget_usd: 15.00
scorers:
