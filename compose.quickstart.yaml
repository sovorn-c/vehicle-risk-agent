name: vehicle-risk-agent-quickstart

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - quickstart_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 10

  agent-seed:
    build:
      context: .
      dockerfile: Dockerfile
    image: vehicle-risk-agent:0.1.0
    restart: "no"
    command: ["python", "-m", "vehicle_risk_agent.cli.seed"]
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy

  agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vehicle-risk-agent:0.1.0
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/postgres
      MCP_SERVER_URL: ${QUICKSTART_MCP_SERVER_URL:-https://vehicle-mcp.chhlatbot.com/mcp}
    ports:
      - "${VEHICLE_RISK_AGENT_QUICKSTART_PORT:-8001}:8001"
    depends_on:
      db:
        condition: service_healthy
      agent-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/health\")'"]
      interval: 3s
      timeout: 2s
      retries: 10

volumes:
  quickstart_db_data:
